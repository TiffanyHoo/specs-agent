[project]
name = "specs-agent-backend"
version = "0.1.0"
description = "前端工程规范问答 Agent 后端：FastAPI + LangGraph + FAISS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "faiss-cpu>=1.8",
    "openai>=1.50",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
